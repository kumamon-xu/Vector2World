name: Vector2World Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product SemVer
        required: true
        default: 1.0.0-rc.1
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: spike-viewer/package-lock.json
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.Substring(1) } else { '${{ inputs.version }}' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "package-version=$($version.Split('-')[0])" >> $env:GITHUB_OUTPUT
      - name: Download verified WiX 3.14 toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix314rtm/wix314-binaries.zip' -OutFile "$env:RUNNER_TEMP\wix.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\wix.zip" -Algorithm SHA256).Hash -ne '13F067F38969FAF163D93A804B48EA0576790A202C8F10291F2000F0E356E934') { throw 'WiX archive checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\wix.zip" "$env:RUNNER_TEMP\wix"
      - name: Build installer and portable bundle
        shell: pwsh
        run: |
          $buildParameters = @{
            Version = '${{ steps.version.outputs.version }}'
            PackageVersion = '${{ steps.version.outputs.package-version }}'
            BuildNumber = '${{ github.run_number }}'
            WixBin = "$env:RUNNER_TEMP\wix"
          }
          if ('${{ github.ref_type }}' -eq 'tag') { $buildParameters.Release = $true }
          & .\release\windows\build-release.ps1 @buildParameters
      - name: Build upgrade baseline
        shell: pwsh
        run: |
          & .\release\windows\build-release.ps1 -Version 0.9.0 -PackageVersion 0.9.0 -BuildNumber upgrade-baseline -OutputRoot "$env:RUNNER_TEMP\vector2world-upgrade" -WixBin "$env:RUNNER_TEMP\wix" -SkipTests
          $current = Get-ChildItem output\release -Directory | Select-Object -First 1
          $baseline = Get-ChildItem "$env:RUNNER_TEMP\vector2world-upgrade" -Filter '*.msi' -Recurse | Select-Object -First 1
          if (-not $current -or -not $baseline) { throw 'Unable to prepare upgrade baseline MSI' }
          $destination = New-Item -ItemType Directory -Path (Join-Path $current.FullName 'upgrade-baseline')
          Copy-Item -LiteralPath $baseline.FullName -Destination (Join-Path $destination 'Vector2World-0.9.0.msi')
      - uses: actions/upload-artifact@v7
        with:
          name: vector2world-windows-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: output/release/
          if-no-files-found: error
          retention-days: 14

  clean-windows-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: vector2world-windows-${{ needs.build.outputs.version }}-${{ github.run_number }}
          path: release-artifact
      - name: Verify and run with two clean profiles
        shell: pwsh
        run: |
          $root = Get-ChildItem release-artifact -Directory | Select-Object -First 1
          & .\release\windows\verify-release.ps1 -ReleaseRoot $root.FullName
          & .\release\windows\smoke-release.ps1 -AppImage (Join-Path $root.FullName 'portable\Vector2World') -WorkRoot "$env:RUNNER_TEMP\clean profiles"
          & .\release\windows\e2e-release.ps1 -AppImage (Join-Path $root.FullName 'portable\Vector2World') -WorkRoot "$env:RUNNER_TEMP\packaged e2e"

  installer-lifecycle:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: vector2world-windows-${{ needs.build.outputs.version }}-${{ github.run_number }}
          path: release-artifact
      - name: Install, upgrade, repair and uninstall without deleting user data
        shell: pwsh
        run: |
          $msi = Get-ChildItem release-artifact -Filter '*.msi' -Recurse | Where-Object { $_.FullName -notlike '*upgrade-baseline*' } | Select-Object -First 1
          $previous = Get-ChildItem release-artifact -Filter 'Vector2World-0.9.0.msi' -Recurse | Select-Object -First 1
          if (-not $msi -or -not $previous) { throw 'Current or upgrade baseline MSI missing' }
          & .\release\windows\test-installer-lifecycle.ps1 -Msi $msi.FullName -PreviousMsi $previous.FullName -ExpectedVersion '${{ needs.build.outputs.package-version }}'

  publish-release:
    if: github.ref_type == 'tag'
    needs: [build, clean-windows-smoke, installer-lifecycle]
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: vector2world-windows-${{ needs.build.outputs.version }}-${{ github.run_number }}
          path: release-artifact
      - name: Create, download-verify and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $version = '${{ needs.build.outputs.version }}'
          $root = Get-ChildItem release-artifact -Directory | Select-Object -First 1
          if (-not $root) { throw 'Release artifact root is missing' }
          if ((gh release view $tag 2>$null)) { throw "Release $tag already exists and will not be overwritten" }
          $metadata = Get-Content -Raw -LiteralPath (Join-Path $root.FullName 'release-metadata.json') | ConvertFrom-Json
          if ($metadata.signingStatus -ne 'UNSIGNED' -or $metadata.version -ne $version -or $metadata.gitSha -ne '${{ github.sha }}') {
            throw 'Tag, version, commit or signing metadata mismatch'
          }
          $zip = Get-ChildItem -LiteralPath $root.FullName -Filter '*portable.zip' | Select-Object -First 1
          $msi = Get-ChildItem -LiteralPath (Join-Path $root.FullName 'installer') -Filter '*.msi' | Select-Object -First 1
          if (-not $zip -or -not $msi) { throw 'Portable ZIP or MSI is missing' }
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          # Vector2World $version

          Windows x64 正式版本：把带高度字段的 GeoJSON 或 Shapefile 建筑面转换为经过验证的 3D Tiles。

          - Git commit: ${{ github.sha }}
          - OSM2World commit: $($metadata.osm2worldCommit)
          - Rule / preset: $($metadata.ruleVersion) / $($metadata.presetVersion)
          - Java runtime: $($metadata.javaRuntime)
          - Signing: UNSIGNED（未进行 Authenticode 代码签名；Windows 可能显示“未知发布者”）
          - Validation: Windows 2022/2025 packaged E2E and MSI upgrade/repair/uninstall matrix

          下载后请先使用随附 `SHA256SUMS.txt` 校验文件。程序仅监听本机 `127.0.0.1`，默认保留 `%LOCALAPPDATA%\Vector2World` 中的用户成果与配置。
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          $assets = @(
            $zip.FullName,
            $msi.FullName,
            (Join-Path $root.FullName 'SHA256SUMS.txt'),
            (Join-Path $root.FullName 'release-metadata.json'),
            (Join-Path $root.FullName 'sbom\java.cdx.json'),
            (Join-Path $root.FullName 'sbom\web.cdx.json'),
            (Join-Path $root.FullName 'legal\OSM2World-LICENSE.txt'),
            (Join-Path $root.FullName 'legal\THIRD-PARTY-NOTICES.txt'),
            (Join-Path $root.FullName 'legal\JAVA-DEPENDENCIES.txt')
          )
          & gh release create $tag --verify-tag --draft --title "Vector2World $version" --notes-file $notes @assets
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create draft GitHub Release' }

          $download = Join-Path $env:RUNNER_TEMP 'release-download'
          $null = New-Item -ItemType Directory -Path $download
          & gh release download $tag --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download draft Release assets' }
          $verifyRoot = Join-Path $env:RUNNER_TEMP 'release-download-layout'
          $null = New-Item -ItemType Directory -Path $verifyRoot
          $null = New-Item -ItemType Directory -Path (Join-Path $verifyRoot 'installer')
          $null = New-Item -ItemType Directory -Path (Join-Path $verifyRoot 'sbom')
          $null = New-Item -ItemType Directory -Path (Join-Path $verifyRoot 'portable')
          Copy-Item -LiteralPath (Join-Path $download 'SHA256SUMS.txt') -Destination $verifyRoot
          Copy-Item -LiteralPath (Join-Path $download 'release-metadata.json') -Destination $verifyRoot
          Copy-Item -LiteralPath (Join-Path $download $msi.Name) -Destination (Join-Path $verifyRoot 'installer')
          Copy-Item -LiteralPath (Join-Path $download 'java.cdx.json') -Destination (Join-Path $verifyRoot 'sbom')
          Copy-Item -LiteralPath (Join-Path $download 'web.cdx.json') -Destination (Join-Path $verifyRoot 'sbom')
          Expand-Archive -LiteralPath (Join-Path $download $zip.Name) -DestinationPath (Join-Path $verifyRoot 'portable')
          Copy-Item -LiteralPath (Join-Path $download $zip.Name) -Destination $verifyRoot
          & .\release\windows\verify-release.ps1 -ReleaseRoot $verifyRoot
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded GitHub Release assets failed verification' }
          & gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish verified GitHub Release' }
          Write-Host "VECTOR2WORLD_GITHUB_RELEASE_OK $tag"
