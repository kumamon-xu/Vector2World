name: Vector2World Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product SemVer
        required: true
        default: 1.0.0-rc.1
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: spike-viewer/package-lock.json
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.Substring(1) } else { '${{ inputs.version }}' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "package-version=$($version.Split('-')[0])" >> $env:GITHUB_OUTPUT
      - name: Download verified WiX 3.14 toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix314rtm/wix314-binaries.zip' -OutFile "$env:RUNNER_TEMP\wix.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\wix.zip" -Algorithm SHA256).Hash -ne '13F067F38969FAF163D93A804B48EA0576790A202C8F10291F2000F0E356E934') { throw 'WiX archive checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\wix.zip" "$env:RUNNER_TEMP\wix"
      - name: Materialize signing certificate
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.VECTOR2WORLD_SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) { throw 'Production tag builds require VECTOR2WORLD_SIGN_PFX_BASE64' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\vector2world-sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "VECTOR2WORLD_SIGN_PFX=$env:RUNNER_TEMP\vector2world-sign.pfx" >> $env:GITHUB_ENV
      - name: Build installer and portable bundle
        shell: pwsh
        env:
          VECTOR2WORLD_SIGN_PASSWORD: ${{ secrets.VECTOR2WORLD_SIGN_PASSWORD }}
        run: |
          $arguments = @('-Version','${{ steps.version.outputs.version }}','-PackageVersion','${{ steps.version.outputs.package-version }}','-BuildNumber','${{ github.run_number }}','-WixBin',"$env:RUNNER_TEMP\wix")
          if ('${{ github.ref_type }}' -eq 'tag') { $arguments += '-Release' }
          & .\release\windows\build-release.ps1 @arguments
      - name: Build unsigned upgrade baseline
        shell: pwsh
        run: |
          & .\release\windows\build-release.ps1 -Version 0.9.0 -PackageVersion 0.9.0 -BuildNumber upgrade-baseline -OutputRoot "$env:RUNNER_TEMP\vector2world-upgrade" -WixBin "$env:RUNNER_TEMP\wix" -SkipTests
          $current = Get-ChildItem output\release -Directory | Select-Object -First 1
          $baseline = Get-ChildItem "$env:RUNNER_TEMP\vector2world-upgrade" -Filter '*.msi' -Recurse | Select-Object -First 1
          if (-not $current -or -not $baseline) { throw 'Unable to prepare upgrade baseline MSI' }
          $destination = New-Item -ItemType Directory -Path (Join-Path $current.FullName 'upgrade-baseline')
          Copy-Item -LiteralPath $baseline.FullName -Destination (Join-Path $destination 'Vector2World-0.9.0.msi')
      - uses: actions/upload-artifact@v4
        with:
          name: vector2world-windows-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: output/release/
          if-no-files-found: error
          retention-days: 14

  clean-windows-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: vector2world-windows-${{ needs.build.outputs.version }}-${{ github.run_number }}
          path: release-artifact
      - name: Verify and run with two clean profiles
        shell: pwsh
        run: |
          $root = Get-ChildItem release-artifact -Directory | Select-Object -First 1
          & .\release\windows\verify-release.ps1 -ReleaseRoot $root.FullName
          & .\release\windows\smoke-release.ps1 -AppImage (Join-Path $root.FullName 'portable\Vector2World') -WorkRoot "$env:RUNNER_TEMP\clean profiles"
          & .\release\windows\e2e-release.ps1 -AppImage (Join-Path $root.FullName 'portable\Vector2World') -WorkRoot "$env:RUNNER_TEMP\packaged e2e"

  installer-lifecycle:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: vector2world-windows-${{ needs.build.outputs.version }}-${{ github.run_number }}
          path: release-artifact
      - name: Install, upgrade, repair and uninstall without deleting user data
        shell: pwsh
        run: |
          $msi = Get-ChildItem release-artifact -Filter '*.msi' -Recurse | Where-Object { $_.FullName -notlike '*upgrade-baseline*' } | Select-Object -First 1
          $previous = Get-ChildItem release-artifact -Filter 'Vector2World-0.9.0.msi' -Recurse | Select-Object -First 1
          if (-not $msi -or -not $previous) { throw 'Current or upgrade baseline MSI missing' }
          & .\release\windows\test-installer-lifecycle.ps1 -Msi $msi.FullName -PreviousMsi $previous.FullName -ExpectedVersion '${{ needs.build.outputs.package-version }}'
